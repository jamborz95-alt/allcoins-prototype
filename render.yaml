services:
  - type: web
    name: allcoins-rp-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLCOINS_RP_SERVER_KEY
        sync: false
      - key: ALLCOINS_RP_INTERNAL_KEY
        sync: false
      - key: ALLCOINS_INTERNAL_API_URL
        value: https://allcoins-server.onrender.com
      - key: ALLCOINS_INTERNAL_API_KEY
        sync: false
